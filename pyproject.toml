[tool.poetry]
name = "llm-non-causal-ner"
version = "0.1.0"
description = ""
authors = ["Fred-Eric Kirsi <vegetablejuiceftw@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
transformers = "*"
datasets = "*"
torch = "*"
seqeval = "*"
accelerate = "*"
optimum = "*"
flash-attn = "*"
billm = "*"
peft = "*"
python-dotenv = {extras = ["cli"], version = "*"}
evaluate = "*"

[tool.poetry.group.dev.dependencies]
black = "^23.3.0"
isort = "^5.12.0"
flake8 = "^6.0.0"
pre-commit = "^3.3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
